<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사상가 매칭 게임 (배지리X통합사회)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background-color: #f3f4f6;
      touch-action: manipulation;
    }
    
    /* 듀오링고 스타일 버튼 및 카드 */
    .duo-btn {
      transition: all 0.1s;
      border-bottom-width: 4px;
    }
    .duo-btn:active {
      transform: translateY(4px);
      border-bottom-width: 0px;
      margin-top: 4px;
    }
    
    .philosopher-card {
      transition: all 0.2s;
      border: 2px solid #e5e7eb;
      border-bottom-width: 4px;
      border-bottom-color: #d1d5db;
    }
    .philosopher-card:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .philosopher-card:hover {
      border-color: #3b82f6;
    }
    
    /* 하단 피드백 패널 애니메이션 */
    .feedback-panel {
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .feedback-panel.show {
      transform: translateY(0);
    }

    .hidden-screen {
      display: none !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- 시작 화면 -->
  <div id="startScreen" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center flex flex-col items-center gap-6">
    <div class="space-y-2">
      <h1 class="text-3xl font-extrabold text-gray-800">사상가 매칭 게임</h1>
      <p class="text-lg font-bold text-blue-500">배지리X통합사회</p>
    </div>
    
    <div class="p-4 bg-gray-50 rounded-xl border-2 border-gray-100 flex flex-col items-center gap-3">
      <p class="text-sm text-gray-600 font-semibold">스마트폰으로 접속하기</p>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://geotoramm.github.io/justiceqz/" alt="게임 접속 QR 코드" class="w-32 h-32 rounded-lg shadow-sm">
    </div>

    <p class="text-gray-600 font-medium">다양한 분배 갈등 상황에서<br>사상가들이 내릴 결론을 맞춰보세요!</p>
    <button onclick="startGame()" class="duo-btn w-full py-4 bg-blue-500 hover:bg-blue-600 border-blue-700 text-white rounded-xl font-bold text-xl mt-4">
      게임 시작하기
    </button>
  </div>

  <!-- 게임 화면 -->
  <div id="gameScreen" class="w-full max-w-md hidden-screen flex-col h-[90vh] max-h-[800px]">
    
    <!-- 진행률 바 -->
    <div class="w-full h-4 bg-gray-200 rounded-full mb-6 relative overflow-hidden">
      <div id="progressBar" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
    </div>

    <div class="flex-1 flex flex-col gap-6 overflow-y-auto pb-32 no-scrollbar">
      <!-- 문제 영역 -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border-2 border-gray-100 text-center">
        <span class="inline-block px-3 py-1 bg-blue-100 text-blue-600 rounded-lg text-sm font-bold mb-3" id="questionBadge">문제 1 / 20</span>
        <h2 id="questionText" class="text-lg font-bold text-gray-800 break-keep leading-relaxed">
          문제 텍스트
        </h2>
      </div>

      <!-- 선택지 영역 -->
      <div id="optionsContainer" class="grid grid-cols-2 gap-3">
        <!-- JS로 동적 생성됨 -->
      </div>
    </div>

    <!-- 피드백 패널 (정답/오답 시 하단에서 슬라이드업) -->
    <div id="feedbackPanel" class="feedback-panel fixed bottom-0 left-0 right-0 w-full max-w-md mx-auto bg-white border-t-4 p-6 flex items-center justify-between z-50">
      <div class="flex items-center gap-4">
        <img id="feedbackImg" src="" alt="캐릭터" class="w-16 h-16 object-contain">
        <div>
          <h3 id="feedbackTitle" class="text-xl font-black mb-1"></h3>
          <p id="feedbackDesc" class="text-sm font-medium"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- 최종 투표 화면 -->
  <div id="voteScreen" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 hidden-screen">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-black text-gray-800 mb-2">모든 라운드 종료!</h2>
      <p class="text-gray-600 font-medium">최종 점수: <span id="finalScore" class="text-blue-600 font-bold text-xl">0</span> 점</p>
    </div>

    <form id="voteForm" class="flex flex-col gap-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">학번 및 이름</label>
        <input type="text" id="studentName" placeholder="예: 10101 홍길동" required class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none font-medium">
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">가장 지지하는 사상가</label>
        <select id="finalVote" required class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none font-medium">
          <option value="">선택해주세요</option>
          <option value="아리스토텔레스">아리스토텔레스</option>
          <option value="맹자">맹자</option>
          <option value="플라톤">플라톤</option>
          <option value="롤스">존 롤스</option>
          <option value="노직">로버트 노직</option>
          <option value="마르크스">카를 마르크스</option>
          <option value="매킨타이어">알래스데어 매킨타이어</option>
          <option value="왈처">마이클 왈처</option>
          <option value="샌델">마이클 샌델</option>
          <option value="벤담">제러미 벤담</option>
          <option value="베카리아">체사레 베카리아</option>
          <option value="칸트">임마누엘 칸트</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1">지지하는 이유</label>
        <textarea id="voteReason" rows="3" placeholder="자신의 생각을 1~2문장으로 적어주세요." required class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none resize-none font-medium"></textarea>
      </div>

      <button type="submit" class="duo-btn w-full py-4 bg-green-500 hover:bg-green-600 border-green-700 text-white rounded-xl font-bold text-lg mt-2">
        결과 제출하기
      </button>
    </form>
  </div>

  <!-- 제출 완료 화면 -->
  <div id="thankYouScreen" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center hidden-screen flex flex-col items-center gap-6">
    <img src="몽련이 졸업.png" alt="완료 캐릭터" class="w-32 h-32 object-contain">
    <div>
      <h2 class="text-3xl font-black text-gray-800 mb-2">제출 완료!</h2>
      <p class="text-gray-600 font-medium">수고하셨습니다.<br>성공적으로 기록되었습니다.</p>
    </div>
  </div>

  <script>
    // 구글 앱스 스크립트 웹앱 URL (반드시 본인의 URL로 교체하세요!)
    const SCRIPT_URL = '여기에_웹앱_URL을_붙여넣으세요';

    // 사상가 기본 정보
    const philosophersData = [
      { id: '아리스토텔레스', name: '아리스토텔레스', keyword: '가치에 비례하는 분배' },
      { id: '맹자', name: '맹자', keyword: '의(義)로운 분배와 항산' },
      { id: '플라톤', name: '플라톤', keyword: '직분과 조화' },
      { id: '롤스', name: '존 롤스', keyword: '최소 수혜자 최대 이익' },
      { id: '노직', name: '로버트 노직', keyword: '소유 권리와 최소 국가' },
      { id: '마르크스', name: '마르크스', keyword: '필요에 따른 분배' },
      { id: '매킨타이어', name: '매킨타이어', keyword: '공동체적 전통과 덕' },
      { id: '왈처', name: '마이클 왈처', keyword: '영역별 복합 평등' },
      { id: '샌델', name: '마이클 샌델', keyword: '공동선과 시민적 연대' },
      { id: '벤담', name: '제러미 벤담', keyword: '최대 다수의 최대 행복' },
      { id: '베카리아', name: '베카리아', keyword: '범죄 예방과 공리주의' },
      { id: '칸트', name: '임마누엘 칸트', keyword: '응보적 정의와 인격 존중' }
    ];

    // 문제 데이터 (총 20문제)
    const questions = [
      { text: "우리 마을은 개인의 타고난 재능이나 가정환경 같은 '우연적 요소'가 분배 결과를 좌우해서는 안 된다고 생각합니다. 따라서 가장 어려운 이웃(최소 수혜자)에게 가장 큰 혜택이 가도록 정책을 세워야 합니다.", correct: '롤스' },
      { text: "자원을 분배할 때 제일 중요한 것은 그 자원을 '정당하게 취득하고 이전했는가'입니다. 개인이 정당하게 번 돈을 국가가 세금으로 강제로 빼앗아 재분배하는 것은 개인의 권리 침해입니다.", correct: '노직' },
      { text: "모두가 자신의 능력에 따라 일하고, 각자의 '필요'에 따라 자원을 분배받는 마을을 만들어야 불평등이 완전히 사라집니다.", correct: '마르크스' },
      { text: "각자의 가치와 기여도에 '비례'하여 자원을 나누어 주어야 합니다. 공적을 많이 세운 사람에게 더 많은 몫이 돌아가는 것이 기하학적 비례에 맞는 정의입니다.", correct: '아리스토텔레스' },
      { text: "마을의 정치, 경제, 교육 등 '다양한 삶의 영역'에는 각기 다른 분배 기준이 있어야 합니다. 돈이 많다고 해서 교육이나 권력까지 독점하는 것은 부정의입니다.", correct: '왈처' },
      { text: "마을의 정의는 단순히 개인의 권리 보장이 아니라, 우리가 속한 공동체의 '연대'와 '공동선'을 함께 고민할 때 실현될 수 있습니다.", correct: '샌델' },
      { text: "우리는 고립된 개인이 아니라 마을의 역사와 '전통'을 공유하는 서사적 자아입니다. 우리 공동체의 덕목을 실천하는 것이 정의입니다.", correct: '매킨타이어' },
      { text: "마을의 정책은 그 정책이 가져올 쾌락과 고통을 계산하여, '최대 다수에게 최대의 행복'을 가져다주는 방향으로 결정되어야 합니다.", correct: '벤담' },
      { text: "마을의 규범을 어긴 자에 대한 형벌은 범죄자가 죗값을 치르게 하는 것보다, 다른 사람들이 범죄를 저지르지 않도록 '예방'하는 데 목적이 있어야 합니다.", correct: '베카리아' },
      { text: "형벌은 오직 그가 '범죄를 저질렀기 때문'에 부과되어야 합니다. 범죄자를 다른 목적(예방 등)을 위한 수단으로 취급해서는 안 되며, 살인자는 반드시 사형에 처해야 합니다.", correct: '칸트' },
      { text: "마을 주민 각자가 자신의 타고난 성향에 맞는 '직분'에 충실하고 서로 간섭하지 않으며 지혜, 용기, 절제의 덕을 발휘하여 조화를 이룰 때 정의가 실현됩니다.", correct: '플라톤' },
      { text: "정의란 곧 '의(義)로운 것'입니다. 촌장은 백성들이 도덕적인 마음(항심)을 유지할 수 있도록, 먼저 그들의 경제적 생활(항산)을 안정시켜 주어야 합니다.", correct: '맹자' },
      { text: "사회적, 경제적 불평등이 허용되려면 모든 사람에게 공정한 기회가 주어져야 하며, 그 결과가 사회의 가장 약자에게 이익이 되어야만 합니다.", correct: '롤스' },
      { text: "국가는 치안과 계약 이행 정도만 담당하는 '최소 국가'여야 합니다. 부유층의 재산을 강제로 거두어 빈곤층을 돕는 복지 정책은 부당합니다.", correct: '노직' },
      { text: "자본주의 사회의 구조적 착취를 없애기 위해서는 사유재산을 폐지하고 생산수단을 공동으로 소유하는 평등 사회로 나아가야 합니다.", correct: '마르크스' },
      { text: "타인에게 부당하게 손해를 입힌 자에게는 그만큼의 불이익을 주고, 피해자에게는 보상을 해주어 원래의 균형을 되찾게 하는 '교정적 정의'가 필요합니다.", correct: '아리스토텔레스' },
      { text: "의료나 교육은 시장의 논리인 '돈'이 아니라, 그 영역 고유의 의미인 '필요'나 '배움'의 기준에 따라 분배되는 '복합 평등'이 실현되어야 합니다.", correct: '왈처' },
      { text: "훌륭한 통치란 눈앞의 이익(利)을 좇는 것이 아니라, 사람으로서 마땅히 지켜야 할 바른 길인 '의(義)'를 앞세우는 왕도 정치입니다.", correct: '맹자' },
      { text: "사형 제도는 순간적인 공포만 줄 뿐입니다. 지속적으로 고통을 보여주는 '종신 노역형'이 범죄를 억제하는 데 훨씬 더 효과적이고 유용합니다.", correct: '베카리아' },
      { text: "동해 보복의 법칙(응보주의)에 따라 범죄자가 가한 피해와 정확히 동등한 형벌을 내리는 것만이 인간의 존엄성을 존중하는 길입니다.", correct: '칸트' }
    ];

    // 캐릭터 피드백 이미지 리스트 (png 확장자로 통일)
    const images = {
      correct: ['몽련이 필승.png', '몽련이 오케.png', '몽련이 신남.png'],
      wrong: ['몽련이 안돼.png', '몽련이 놀람.png']
    };

    let currentQuestionIndex = 0;
    let score = 0;
    let gameQuestions = [];

    // 유틸리티: 배열 섞기
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // 유틸리티: 랜덤 이미지 뽑기
    function getRandomImage(type) {
      const arr = images[type];
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // 화면 전환
    function showScreen(screenId) {
      document.getElementById('startScreen').classList.add('hidden-screen');
      document.getElementById('gameScreen').classList.add('hidden-screen');
      document.getElementById('voteScreen').classList.add('hidden-screen');
      document.getElementById('thankYouScreen').classList.add('hidden-screen');
      
      const target = document.getElementById(screenId);
      target.classList.remove('hidden-screen');
      if(screenId === 'gameScreen') {
        target.style.display = 'flex';
      }
    }

    function startGame() {
      score = 0;
      currentQuestionIndex = 0;
      gameQuestions = shuffleArray([...questions]);
      showScreen('gameScreen');
      loadQuestion();
    }

    function loadQuestion() {
      // 진행률 바 업데이트
      const progress = (currentQuestionIndex / gameQuestions.length) * 100;
      document.getElementById('progressBar').style.width = `${progress}%`;
      document.getElementById('questionBadge').innerText = `문제 ${currentQuestionIndex + 1} / ${gameQuestions.length}`;

      const q = gameQuestions[currentQuestionIndex];
      document.getElementById('questionText').innerText = q.text;

      // 5명의 후보 동적 생성 (정답 1명 + 오답 4명 무작위)
      let options = [q.correct];
      let availableOthers = philosophersData.map(p => p.id).filter(id => id !== q.correct);
      availableOthers = shuffleArray(availableOthers);
      
      for(let i=0; i<4; i++){
        options.push(availableOthers[i]);
      }
      options = shuffleArray(options); // 보기 순서 섞기

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      options.forEach(optId => {
        const pData = philosophersData.find(p => p.id === optId);
        const btn = document.createElement('button');
        btn.className = 'philosopher-card bg-white rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer';
        btn.onclick = () => checkAnswer(optId, q.correct, btn);
        
        btn.innerHTML = `
          <div class="font-bold text-gray-800 text-lg">${pData.name}</div>
          <div class="text-xs text-blue-600 font-semibold bg-blue-50 px-2 py-1 rounded w-full break-keep">${pData.keyword}</div>
        `;
        container.appendChild(btn);
      });
    }

    function checkAnswer(selected, correct, btnElement) {
      // 버튼 비활성화 (중복 클릭 방지)
      const allBtns = document.querySelectorAll('.philosopher-card');
      allBtns.forEach(b => b.onclick = null);

      const panel = document.getElementById('feedbackPanel');
      const fImg = document.getElementById('feedbackImg');
      const fTitle = document.getElementById('feedbackTitle');
      const fDesc = document.getElementById('feedbackDesc');

      if (selected === correct) {
        score += 10;
        btnElement.classList.add('bg-green-100', 'border-green-500');
        
        panel.classList.remove('border-red-500');
        panel.classList.add('border-green-500', 'bg-green-50');
        fTitle.className = 'text-xl font-black mb-1 text-green-700';
        fTitle.innerText = '정답입니다! 훌륭해요!';
        fDesc.className = 'text-sm font-bold text-green-600';
        fDesc.innerText = `올바른 사상가: ${correct}`;
        fImg.src = getRandomImage('correct');
      } else {
        btnElement.classList.add('bg-red-100', 'border-red-500');
        // 정답 버튼 강조
        allBtns.forEach(b => {
          if(b.innerText.includes(correct)) {
            b.classList.add('border-green-500', 'border-4');
          }
        });

        panel.classList.remove('border-green-500');
        panel.classList.add('border-red-500', 'bg-red-50');
        fTitle.className = 'text-xl font-black mb-1 text-red-700';
        fTitle.innerText = '아쉽네요...';
        fDesc.className = 'text-sm font-bold text-red-600';
        fDesc.innerText = `올바른 사상가: ${correct}`;
        fImg.src = getRandomImage('wrong');
      }

      panel.classList.add('show');

      // 1.8초 대기 후 다음 문제 또는 종료
      setTimeout(() => {
        panel.classList.remove('show');
        currentQuestionIndex++;
        if (currentQuestionIndex < gameQuestions.length) {
          loadQuestion();
        } else {
          document.getElementById('finalScore').innerText = score;
          showScreen('voteScreen');
        }
      }, 1800);
    }

    // 결과 제출 로직
    async function submitVote(e) {
      e.preventDefault();
      
      const studentName = document.getElementById('studentName').value.trim();
      const selectedPhilosopher = document.getElementById('finalVote').value;
      const voteReason = document.getElementById('voteReason').value.trim();

      const submitBtn = e.target.querySelector('button');
      const originalBtnText = submitBtn.innerHTML;
      submitBtn.innerHTML = '전송 중... ⏳';
      submitBtn.disabled = true;

      try {
        const formData = new URLSearchParams();
        formData.append('name', studentName);
        formData.append('score', score);
        formData.append('philosopher', selectedPhilosopher);
        formData.append('reason', voteReason);

        // 앱스 스크립트로 POST 전송
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: formData,
        });

        showScreen('thankYou');
      } catch (error) {
        console.error('제출 에러:', error);
        // 에러가 발생해도 완료 화면을 띄워 사용자 경험을 해치지 않음
        showScreen('thankYou');
      } finally {
        submitBtn.innerHTML = originalBtnText;
        submitBtn.disabled = false;
      }
    }

    document.getElementById('voteForm').addEventListener('submit', submitVote);
  </script>
</body>
