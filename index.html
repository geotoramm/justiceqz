<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사상가 매칭 게임 (배지리X통합사회)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #ffffff;
      touch-action: manipulation;
      user-select: none;
    }
    
    /* 듀오링고 스타일 카드 (입체감) */
    .duo-card {
      border: 2px solid #e5e5e5;
      border-bottom-width: 4px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.1s;
      background-color: white;
    }
    .duo-card:active:not(.disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }
    .duo-card.selected {
      border-color: #84d8ff;
      background-color: #ddf4ff;
      border-bottom-color: #1cb0f6;
    }
    .duo-card.disabled {
      cursor: default;
      opacity: 0.7;
    }

    /* 듀오링고 스타일 버튼 */
    .duo-btn {
      border-radius: 16px;
      border-bottom-width: 4px;
      font-weight: 800;
      transition: all 0.1s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .duo-btn:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
      margin-top: 2px;
    }
    
    .btn-green { background-color: #58cc02; border-color: #58a700; color: white; }
    .btn-gray { background-color: #e5e5e5; border-color: #cecece; color: #afafaf; cursor: not-allowed; }
    .btn-red { background-color: #ff4b4b; border-color: #ea2b2b; color: white; }
    .btn-blue { background-color: #1cb0f6; border-color: #1899d6; color: white; }

    /* 하단 피드백 영역 */
    #bottomArea {
      transition: background-color 0.2s ease;
    }
    .feedback-correct { background-color: #d7ffb8; border-top: 2px solid #b3e790; }
    .feedback-wrong { background-color: #ffdfe0; border-top: 2px solid #f7c3c5; }
    
    .hidden-screen { display: none !important; }
    
    /* 스크롤바 숨기기 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-gray-50">

  <!-- ================= 시작 화면 ================= -->
  <div id="startScreen" class="w-full max-w-md bg-white rounded-3xl shadow-sm border-2 border-gray-100 p-8 text-center flex flex-col items-center gap-6 m-4">
    <div class="space-y-2">
      <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">사상가 매칭 게임</h1>
      <p class="text-lg font-bold text-[#1cb0f6]">배지리 X 통합사회</p>
    </div>
    
    <!-- QR 코드 영역 -->
    <div class="p-5 bg-gray-50 rounded-2xl border-2 border-gray-100 flex flex-col items-center gap-3">
      <p class="text-sm text-gray-500 font-bold">스마트폰으로 플레이하기</p>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://geotoramm.github.io/justiceqz/" alt="게임 접속 QR 코드" class="w-32 h-32 rounded-xl">
    </div>

    <p class="text-gray-600 font-bold text-sm">다양한 분배 갈등 상황에서<br>사상가들이 내릴 결론을 맞춰보세요!</p>
    
    <button onclick="startGame()" class="duo-btn btn-green w-full py-4 text-xl mt-4">
      시작하기
    </button>
  </div>


  <!-- ================= 게임 화면 ================= -->
  <div id="gameScreen" class="w-full max-w-md hidden-screen flex-col h-[100dvh] bg-white relative">
    
    <!-- 상단 진행바 -->
    <div class="flex items-center gap-4 p-4 pt-6">
      <div class="w-full h-4 bg-gray-200 rounded-full relative overflow-hidden">
        <div id="progressBar" class="h-full bg-[#58cc02] transition-all duration-300 rounded-full w-0 relative">
          <div class="absolute top-1 left-2 right-2 h-1 bg-white opacity-20 rounded-full"></div>
        </div>
      </div>
    </div>

    <!-- 문제 및 선택지 영역 -->
    <div class="flex-1 flex flex-col px-4 overflow-y-auto no-scrollbar pb-40">
      
      <h2 class="text-2xl font-extrabold text-gray-800 mb-6 mt-2 leading-tight break-keep">
        <span id="questionText">문제 텍스트가 여기에 표시됩니다.</span>
      </h2>

      <!-- 선택지 그리드 -->
      <div id="optionsContainer" class="grid grid-cols-1 gap-3">
        <!-- JS로 동적 생성 -->
      </div>
    </div>

    <!-- 하단 고정 제어 영역 (확인 / 계속하기 패널) -->
    <div id="bottomArea" class="absolute bottom-0 w-full p-4 bg-white border-t-2 border-gray-200 flex flex-col gap-4 z-10">
      
      <!-- 정답/오답 팝업 컨텐츠 (숨겨져 있다가 나타남) -->
      <div id="feedbackContent" class="hidden flex items-end gap-4">
        <img id="feedbackImg" src="" alt="캐릭터" class="w-20 h-20 object-contain drop-shadow-md pb-1">
        <div class="flex-1 pb-2">
          <h3 id="feedbackTitle" class="text-2xl font-black mb-1">정답입니다!</h3>
          <p id="feedbackDesc" class="text-base font-bold opacity-80">훌륭해요!</p>
        </div>
      </div>

      <!-- 메인 액션 버튼 -->
      <button id="actionBtn" onclick="handleAction()" class="duo-btn btn-gray w-full py-4 text-xl" disabled>
        확인
      </button>
    </div>

  </div>


  <!-- ================= 최종 투표 화면 ================= -->
  <div id="voteScreen" class="w-full max-w-md bg-white rounded-3xl shadow-sm border-2 border-gray-100 p-8 hidden-screen m-4">
    <div class="text-center mb-8">
      <img src="몽련이 신남.png" class="w-24 h-24 mx-auto mb-4 object-contain">
      <h2 class="text-3xl font-black text-gray-800 mb-2">레슨 완료!</h2>
      <p class="text-gray-500 font-bold">획득 점수: <span id="finalScore" class="text-[#f59e0b] font-black text-2xl">0</span> XP</p>
    </div>

    <form id="voteForm" class="flex flex-col gap-5">
      <div>
        <label class="block text-sm font-black text-gray-700 mb-2">학번 및 이름</label>
        <input type="text" id="studentName" placeholder="예: 10101 홍길동" required class="w-full p-4 bg-gray-100 border-2 border-transparent rounded-2xl focus:bg-white focus:border-[#1cb0f6] focus:outline-none font-bold transition-colors">
      </div>

      <div>
        <label class="block text-sm font-black text-gray-700 mb-2">가장 지지하는 사상가</label>
        <select id="finalVote" required class="w-full p-4 bg-gray-100 border-2 border-transparent rounded-2xl focus:bg-white focus:border-[#1cb0f6] focus:outline-none font-bold appearance-none transition-colors">
          <option value="">선택해주세요</option>
          <option value="아리스토텔레스">아리스토텔레스</option>
          <option value="맹자">맹자</option>
          <option value="플라톤">플라톤</option>
          <option value="롤스">존 롤스</option>
          <option value="노직">로버트 노직</option>
          <option value="마르크스">카를 마르크스</option>
          <option value="매킨타이어">알래스데어 매킨타이어</option>
          <option value="왈처">마이클 왈처</option>
          <option value="샌델">마이클 샌델</option>
          <option value="벤담">제러미 벤담</option>
          <option value="베카리아">체사레 베카리아</option>
          <option value="칸트">임마누엘 칸트</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-black text-gray-700 mb-2">지지하는 이유</label>
        <textarea id="voteReason" rows="3" placeholder="자신의 생각을 적어주세요." required class="w-full p-4 bg-gray-100 border-2 border-transparent rounded-2xl focus:bg-white focus:border-[#1cb0f6] focus:outline-none resize-none font-bold transition-colors"></textarea>
      </div>

      <button type="submit" class="duo-btn btn-blue w-full py-4 text-xl mt-4">
        결과 제출하기
      </button>
    </form>
  </div>


  <!-- ================= 제출 완료 화면 ================= -->
  <div id="thankYouScreen" class="w-full max-w-md bg-white rounded-3xl shadow-sm border-2 border-gray-100 p-10 text-center hidden-screen flex flex-col items-center gap-6 m-4">
    <img src="몽련이 졸업.png" alt="완료 캐릭터" class="w-40 h-40 object-contain">
    <div>
      <h2 class="text-3xl font-black text-[#58cc02] mb-3">제출 완료!</h2>
      <p class="text-gray-600 font-bold text-lg">완벽하게 기록되었습니다.<br>수고하셨습니다!</p>
    </div>
  </div>


  <!-- ================= 자바스크립트 로직 ================= -->
  <script>
    // ★ 여기에 구글 앱스 스크립트 웹앱 URL을 붙여넣으세요!
    const SCRIPT_URL = '여기에_웹앱_URL을_붙여넣으세요';

    // 사상가 기본 정보
    const philosophersData = [
      { id: '아리스토텔레스', name: '아리스토텔레스', keyword: '가치에 비례하는 분배' },
      { id: '맹자', name: '맹자', keyword: '의(義)로운 분배와 항산' },
      { id: '플라톤', name: '플라톤', keyword: '직분과 조화' },
      { id: '롤스', name: '존 롤스', keyword: '최소 수혜자 최대 이익' },
      { id: '노직', name: '로버트 노직', keyword: '소유 권리와 최소 국가' },
      { id: '마르크스', name: '마르크스', keyword: '필요에 따른 분배' },
      { id: '매킨타이어', name: '매킨타이어', keyword: '공동체적 전통과 덕' },
      { id: '왈처', name: '마이클 왈처', keyword: '영역별 복합 평등' },
      { id: '샌델', name: '마이클 샌델', keyword: '공동선과 시민적 연대' },
      { id: '벤담', name: '제러미 벤담', keyword: '최대 다수의 최대 행복' },
      { id: '베카리아', name: '베카리아', keyword: '범죄 예방과 공리주의' },
      { id: '칸트', name: '임마누엘 칸트', keyword: '응보적 정의와 인격 존중' }
    ];

    // 문제 데이터 (20문제)
    const questions = [
      { text: "개인의 타고난 재능이나 가정환경 같은 '우연적 요소'가 분배 결과를 좌우해서는 안 됩니다. 가장 어려운 이웃(최소 수혜자)에게 가장 큰 혜택이 가도록 정책을 세워야 합니다.", correct: '롤스' },
      { text: "자원을 분배할 때 제일 중요한 것은 그 자원을 '정당하게 취득하고 이전했는가'입니다. 개인이 정당하게 번 돈을 국가가 재분배하는 것은 개인의 권리 침해입니다.", correct: '노직' },
      { text: "모두가 자신의 능력에 따라 일하고, 각자의 '필요'에 따라 자원을 분배받는 마을을 만들어야 불평등이 완전히 사라집니다.", correct: '마르크스' },
      { text: "각자의 가치와 기여도에 '비례'하여 자원을 나누어 주어야 합니다. 공적을 많이 세운 사람에게 더 많은 몫이 돌아가는 것이 기하학적 비례에 맞는 정의입니다.", correct: '아리스토텔레스' },
      { text: "마을의 정치, 경제, 교육 등 '다양한 삶의 영역'에는 각기 다른 분배 기준이 있어야 합니다. 돈이 많다고 권력까지 독점하는 것은 부정의입니다.", correct: '왈처' },
      { text: "정의는 개인의 권리 보장만이 아니라, 우리가 속한 공동체의 '연대'와 '공동선'을 함께 고민할 때 실현될 수 있습니다.", correct: '샌델' },
      { text: "우리는 고립된 개인이 아니라 마을의 역사와 '전통'을 공유하는 서사적 자아입니다. 우리 공동체의 덕목을 실천하는 것이 정의입니다.", correct: '매킨타이어' },
      { text: "마을의 정책은 그 정책이 가져올 쾌락과 고통을 계산하여, '최대 다수에게 최대의 행복'을 가져다주는 방향으로 결정되어야 합니다.", correct: '벤담' },
      { text: "형벌은 범죄자가 죗값을 치르게 하는 것보다, 다른 사람들이 범죄를 저지르지 않도록 '예방'하는 데 목적이 있어야 합니다.", correct: '베카리아' },
      { text: "형벌은 오직 그가 '범죄를 저질렀기 때문'에 부과되어야 합니다. 범죄자를 다른 목적을 위한 수단으로 취급해서는 안 되며, 살인자는 사형에 처해야 합니다.", correct: '칸트' },
      { text: "마을 주민 각자가 자신의 타고난 성향에 맞는 '직분'에 충실하고 간섭하지 않으며 지혜, 용기, 절제의 덕을 발휘하여 조화를 이룰 때 정의가 실현됩니다.", correct: '플라톤' },
      { text: "정의란 곧 '의(義)로운 것'입니다. 촌장은 백성들이 도덕적인 마음(항심)을 유지할 수 있도록, 경제적 생활(항산)을 안정시켜 주어야 합니다.", correct: '맹자' },
      { text: "사회적, 경제적 불평등이 허용되려면 모든 사람에게 공정한 기회가 주어져야 하며, 그 결과가 사회의 가장 약자에게 이익이 되어야만 합니다.", correct: '롤스' },
      { text: "국가는 치안과 계약 이행 정도만 담당하는 '최소 국가'여야 합니다. 부유층의 재산을 강제로 거두어 빈곤층을 돕는 복지 정책은 부당합니다.", correct: '노직' },
      { text: "자본주의 사회의 구조적 착취를 없애기 위해서는 사유재산을 폐지하고 생산수단을 공동으로 소유하는 평등 사회로 나아가야 합니다.", correct: '마르크스' },
      { text: "타인에게 부당하게 손해를 입힌 자에게는 불이익을 주고, 피해자에게는 보상을 해주어 원래의 균형을 되찾게 하는 '교정적 정의'가 필요합니다.", correct: '아리스토텔레스' },
      { text: "의료나 교육은 돈이 아니라, 그 영역 고유의 의미인 '필요'나 '배움'의 기준에 따라 분배되는 '복합 평등'이 실현되어야 합니다.", correct: '왈처' },
      { text: "훌륭한 통치란 눈앞의 이익을 좇는 것이 아니라, 사람으로서 마땅히 지켜야 할 바른 길인 '의(義)'를 앞세우는 왕도 정치입니다.", correct: '맹자' },
      { text: "사형 제도는 순간적인 공포만 줄 뿐입니다. 지속적으로 고통을 보여주는 '종신 노역형'이 범죄 억제에 훨씬 효과적입니다.", correct: '베카리아' },
      { text: "응보주의에 따라 범죄자가 가한 피해와 정확히 동등한 형벌을 내리는 것만이 인간의 존엄성을 존중하는 길입니다.", correct: '칸트' }
    ];

    // 캐릭터 이미지 리스트
    const images = {
      correct: ['몽련이 필승.png', '몽련이 오케.png', '몽련이 신남.png'],
      wrong: ['몽련이 안돼.png', '몽련이 놀람.png']
    };

    let currentQuestionIndex = 0;
    let score = 0;
    let gameQuestions = [];
    
    // 상태 관리
    let selectedOptionId = null;
    let isAnswerChecked = false;

    // 유틸리티 함수
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function getRandomImage(type) {
      const arr = images[type];
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function showScreen(screenId) {
      ['startScreen', 'gameScreen', 'voteScreen', 'thankYouScreen'].forEach(id => {
        document.getElementById(id).classList.add('hidden-screen');
      });
      document.getElementById(screenId).classList.remove('hidden-screen');
      if(screenId === 'gameScreen') document.getElementById(screenId).style.display = 'flex';
    }

    function startGame() {
      score = 0;
      currentQuestionIndex = 0;
      gameQuestions = shuffleArray([...questions]);
      showScreen('gameScreen');
      loadQuestion();
    }

    function loadQuestion() {
      // 상태 초기화
      selectedOptionId = null;
      isAnswerChecked = false;
      
      // 진행바 애니메이션
      const progress = (currentQuestionIndex / gameQuestions.length) * 100;
      document.getElementById('progressBar').style.width = `${progress}%`;

      // UI 초기화
      document.getElementById('bottomArea').className = 'absolute bottom-0 w-full p-4 bg-white border-t-2 border-gray-200 flex flex-col gap-4 z-10';
      document.getElementById('feedbackContent').classList.add('hidden');
      
      const actionBtn = document.getElementById('actionBtn');
      actionBtn.className = 'duo-btn btn-gray w-full py-4 text-xl';
      actionBtn.innerText = '확인';
      actionBtn.disabled = true;

      // 문제 텍스트 세팅
      const q = gameQuestions[currentQuestionIndex];
      document.getElementById('questionText').innerText = q.text;

      // 5명 후보 생성 (정답 1 + 오답 4)
      let options = [q.correct];
      let availableOthers = philosophersData.map(p => p.id).filter(id => id !== q.correct);
      availableOthers = shuffleArray(availableOthers);
      for(let i=0; i<4; i++) options.push(availableOthers[i]);
      options = shuffleArray(options);

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      options.forEach(optId => {
        const pData = philosophersData.find(p => p.id === optId);
        
        const card = document.createElement('div');
        card.className = 'duo-card p-4 flex items-center justify-between';
        card.onclick = () => selectOption(optId, card);
        
        card.innerHTML = `
          <div class="flex flex-col">
            <span class="text-xl font-black text-gray-800">${pData.name}</span>
            <span class="text-sm font-bold text-gray-500 mt-1">${pData.keyword}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 1단계: 선택지 터치 (파란색으로 활성화)
    function selectOption(id, cardElement) {
      if(isAnswerChecked) return;

      selectedOptionId = id;

      // 모든 카드 초기화
      document.querySelectorAll('.duo-card').forEach(card => {
        card.classList.remove('selected');
      });
      
      // 선택된 카드 스타일 적용
      cardElement.classList.add('selected');

      // 하단 확인 버튼 초록색으로 활성화
      const actionBtn = document.getElementById('actionBtn');
      actionBtn.disabled = false;
      actionBtn.className = 'duo-btn btn-green w-full py-4 text-xl';
    }

    // 2단계: 하단 버튼 컨트롤러 (확인 -> 계속하기)
    function handleAction() {
      if (!isAnswerChecked) {
        checkAnswer();
      } else {
        nextQuestion();
      }
    }

    // 3단계: 정답 확인 및 피드백 팝업
    function checkAnswer() {
      isAnswerChecked = true;
      const q = gameQuestions[currentQuestionIndex];
      const isCorrect = (selectedOptionId === q.correct);

      // 선택지 비활성화
      document.querySelectorAll('.duo-card').forEach(card => card.classList.add('disabled'));

      const bottomArea = document.getElementById('bottomArea');
      const feedbackContent = document.getElementById('feedbackContent');
      const actionBtn = document.getElementById('actionBtn');
      
      const fImg = document.getElementById('feedbackImg');
      const fTitle = document.getElementById('feedbackTitle');
      const fDesc = document.getElementById('feedbackDesc');

      feedbackContent.classList.remove('hidden');

      if (isCorrect) {
        score += 10;
        bottomArea.className = 'absolute bottom-0 w-full p-4 flex flex-col gap-4 z-10 feedback-correct';
        fTitle.className = 'text-2xl font-black mb-1 text-[#58a700]';
        fTitle.innerText = '정답입니다!';
        fDesc.className = 'text-base font-bold text-[#58a700] opacity-80';
        fDesc.innerText = '아주 멋져요!';
        fImg.src = getRandomImage('correct');
        actionBtn.className = 'duo-btn btn-green w-full py-4 text-xl';
      } else {
        bottomArea.className = 'absolute bottom-0 w-full p-4 flex flex-col gap-4 z-10 feedback-wrong';
        fTitle.className = 'text-2xl font-black mb-1 text-[#ea2b2b]';
        fTitle.innerText = '정답이 아닙니다';
        fDesc.className = 'text-base font-bold text-[#ea2b2b] opacity-80';
        fDesc.innerText = `올바른 사상가: ${q.correct}`;
        fImg.src = getRandomImage('wrong');
        actionBtn.className = 'duo-btn btn-red w-full py-4 text-xl';
      }

      actionBtn.innerText = '계속하기';
    }

    // 4단계: 다음 문제로 넘어가기
    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < gameQuestions.length) {
        loadQuestion();
      } else {
        document.getElementById('finalScore').innerText = score;
        showScreen('voteScreen');
      }
    }

    // 결과 제출 로직
    async function submitVote(e) {
      e.preventDefault();
      
      const studentName = document.getElementById('studentName').value.trim();
      const selectedPhilosopher = document.getElementById('finalVote').value;
      const voteReason = document.getElementById('voteReason').value.trim();

      const submitBtn = e.target.querySelector('button');
      const originalBtnText = submitBtn.innerHTML;
      submitBtn.innerHTML = '전송 중...';
      submitBtn.disabled = true;
      submitBtn.classList.replace('btn-blue', 'btn-gray');

      try {
        const formData = new URLSearchParams();
        formData.append('name', studentName);
        formData.append('score', score);
        formData.append('philosopher', selectedPhilosopher);
        formData.append('reason', voteReason);

        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: formData,
        });

        showScreen('thankYouScreen');
      } catch (error) {
        console.error('제출 에러:', error);
        showScreen('thankYouScreen');
      } finally {
        submitBtn.innerHTML = originalBtnText;
        submitBtn.disabled = false;
        submitBtn.classList.replace('btn-gray', 'btn-blue');
      }
    }

    document.getElementById('voteForm').addEventListener('submit', submitVote);
  </script>
</body>
</html>
